{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<form class="lang" method="post" action="{% url 'switch_language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button name="language" value="cs" class="{% if LANGUAGE_CODE == 'cs' %}on{% endif %}">CZ</button>
  <button name="language" value="en" class="{% if LANGUAGE_CODE == 'en' %}on{% endif %}">EN</button>
</form>
