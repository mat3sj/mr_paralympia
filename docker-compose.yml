services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_MEDIA_ROOT: /media
    volumes:
      - media:/media
    depends_on:
      - db

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres:
  media:
  caddy_data:
  caddy_config:
